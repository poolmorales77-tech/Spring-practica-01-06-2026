<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saludo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            padding: 60px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .message {
            color: #28a745;
            font-size: 1.5em;
            font-weight: bold;
            margin: 30px 0;
        }
        
        .status {
            background: #e8f5e9;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            border-radius: 4px;
        }
        
        .status p {
            color: #2e7d32;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Bienvenida</h1>
        <div class="message">
            Servidor Activo!!
        </div>
        <div class="status">
            <p><strong>Estado:</strong> ✓ Online</p>
            <p><strong>Servidor:</strong> Tomcat Embebido</p>
            <p><strong>Puerto:</strong> 8080</p>
            <p><strong>Framework:</strong> Spring Boot 4.0.6</p>
        </div>
    </div>
</body>
</html>
